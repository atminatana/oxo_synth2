# docs.toml — манифест документации (doc-system v1.0.0).
#
# Единственный источник истины о документах: пути, обязательные разделы,
# влияние кода (sources), база и момент проверки (verified).
# Файл читается runtime scripts/doc_system.py; служебные фрагменты документов
# генерируются командой sync. Поля verified обновляет только touch.

[meta]
version = 1
system = "doc-system"
system_version = "1.0.0"
preset = "generic"
installed_at = "2026-11-12"
max_age_days = 90
handoff_path = "docs/agents/handoff.md"
handoff_soft_days = 30
root_coverage = false
required_files = ["AGENTS.md", "docs/docs.toml", "README.md", "scripts/doc_system.py"]

# ---------------------------------------------------------------------------
# Документы
# ---------------------------------------------------------------------------

